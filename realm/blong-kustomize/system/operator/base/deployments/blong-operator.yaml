apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: blong-operator
    app.kubernetes.io/managed-by: blong-kustomize
    app.kubernetes.io/name: blong-operator
    app.kubernetes.io/part-of: blong-operator
    app.kubernetes.io/version: 0.1.0
    blong.feasible.one/spec-hash: 0f19dae8d585d284
  name: blong-operator
  namespace: blong-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: blong-operator
      app.kubernetes.io/part-of: blong-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blong-operator
        app.kubernetes.io/managed-by: blong-kustomize
        app.kubernetes.io/name: blong-operator
        app.kubernetes.io/part-of: blong-operator
        app.kubernetes.io/version: 0.1.0
    spec:
      containers:
        - args:
            - /opt/deploy/suite/realm/blong-kustomize/operator-entry.ts
            - release
          env:
            - name: BLONG_ENV
              value: release
            - name: BLONG_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BLONG_CONTROLLER_INTERVAL
              value: "60"
            - name: BLONG_CONTROLLER_FROM
              value: cr
            - name: BLONG_CONTROLLER_APPLY
              value: "true"
            - name: BLONG_CONTROLLER_PRUNE
              value: "true"
          image: docker.io/library/blong-gogo:1
          name: operator
          ports:
            - containerPort: 8091
              name: rpc
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /opt/deploy/suite
              name: suite
              readOnly: true
            - mountPath: /cache
              name: cache
            - mountPath: /home/node/.blong_releaserc
              name: releaserc-home
              readOnly: true
              subPath: .blong_releaserc
            - mountPath: /etc/blong_releaserc
              name: releaserc-site
              readOnly: true
              subPath: blong_releaserc
            - mountPath: /home/node/.config/blong_release/
              name: gateway-keys
              readOnly: true
      serviceAccountName: blong-operator
      volumes:
        - hostPath:
            path: /opt/deploy/suite
            type: Directory
          name: suite
        - name: cache
          persistentVolumeClaim:
            claimName: blong-operator-artifacts
        - name: releaserc-home
          secret:
            items:
              - key: .blong_releaserc
                path: .blong_releaserc
            optional: true
            secretName: blong-releaserc
        - name: releaserc-site
          secret:
            items:
              - key: blong_releaserc
                path: blong_releaserc
            optional: true
            secretName: blong-releaserc-etc
        - name: gateway-keys
          secret:
            items:
              - key: config
                path: config
            optional: true
            secretName: gateway-keys
