# Federations, clubs, athletes and coaches from the Bulgarian registers.
#
# The handler reads the register vocabulary: `eik` is the registration number,
# `register` the entry, `site` the website, `member` the federation a club
# belongs to, `duty` the coach position. A person name is split into first,
# middle and last; statuses default to `active`, a person to Bulgarian
# nationality and citizenship.
#
# Sources (exported 2026-11-07): registerSf (one federation per Olympic sport),
# registerSk (three active clubs per sport), registerTr (two coaches per sport)
# and the Bulgarian Olympic champions. The registers hold 4 571 clubs and
# 6 427 coaches; a boot seed carries a sample, and a bulk import is a task of
# its own. What is missing is listed in manual-entry.md.

