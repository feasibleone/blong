# RBAC test seed — grants the `sport` capabilities to the seeded roles.
#
# A capability lists the **dotted method names** the caller invokes
# (`sport.athlete.find`), not the handler names (`sportAthleteFind`) — the
# gateway authorizes the route it serves, so a capability written in handler
# names grants nothing and the page answers 403.
#
# Every object of `meta/db/db.ts` is here: the five profile objects have
# hand-written handlers, the other eighteen are the generic CRUD the adapter
# derives from the table. The browser also calls `sport.dropdown.list` (the
# pickers), `sport.portal.params` (the menu) and `subject.object.schema` (the
# model system's schema read), so the view capability carries all three.
#
#   Admin (testAdmin, testUser)  — everything
#   Manager (testManager)        — read + create/edit, no remove
#   Customer (testViewer), Guest — read only
#
# The file name is `accessAuthorizationMerge.yaml` because the seed method is
# derived from it: the content carries the `sport` names, the method is
# blong-access's shared `access.authorization.merge`.
role:
  Admin: sportManage
  Manager: sportMaintain
  Customer: sportView
  Guest: sportView
capability:
  sportView: sport.athlete.find,sport.athlete.get,sport.coach.find,sport.coach.get,sport.specialist.find,sport.specialist.get,sport.federation.find,sport.federation.get,sport.club.find,sport.club.get,sport.sport.find,sport.sport.get,sport.discipline.find,sport.discipline.get,sport.category.find,sport.category.get,sport.cycle.find,sport.cycle.get,sport.area.find,sport.area.get,sport.competition.find,sport.competition.get,sport.edition.find,sport.edition.get,sport.participation.find,sport.participation.get,sport.result.find,sport.result.get,sport.campaign.find,sport.campaign.get,sport.qualification.find,sport.qualification.get,sport.document.find,sport.document.get,sport.attachment.find,sport.attachment.get,sport.award.find,sport.award.get,sport.conferral.find,sport.conferral.get,sport.coaching.find,sport.coaching.get,sport.support.find,sport.support.get,sport.affiliation.find,sport.affiliation.get,sport.dropdown.list,sport.portal.params,subject.object.schema,party.dropdown.list
