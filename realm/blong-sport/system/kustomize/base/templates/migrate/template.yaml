apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: blong-sport-migrate
    app.kubernetes.io/managed-by: blong-kustomize
    app.kubernetes.io/name: blong-sport
    app.kubernetes.io/part-of: blong-sport
    app.kubernetes.io/version: PLACEHOLDER
    blong.feasible.one/attempt-retention: "5"
    blong.feasible.one/spec-hash: 0031fc73bf7e9a94
    blong.feasible.one/suite-version: PLACEHOLDER
    blong.feasible.one/volume-identity: PLACEHOLDER
  name: blong-sport-migrate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blong-sport-migrate-PLACEHOLDER-0f5670ab
        app.kubernetes.io/managed-by: blong-kustomize
        app.kubernetes.io/name: blong-sport
        app.kubernetes.io/part-of: blong-sport
        app.kubernetes.io/version: PLACEHOLDER
    spec:
      containers:
        - args:
            - /opt/deploy/suite/realm/blong-sport/index.ts
            - upgrade
            - release
            - --remote.canSkipSocket=true
          image: PLACEHOLDER
          name: migrate
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /opt/deploy/suite
              name: suite
              readOnly: true
            - mountPath: /home/node/.blong_releaserc
              name: releaserc-home
              readOnly: true
              subPath: .blong_releaserc
            - mountPath: /etc/blong_releaserc
              name: releaserc-site
              readOnly: true
              subPath: blong_releaserc
      restartPolicy: Never
      serviceAccountName: blong
      volumes:
        - hostPath:
            path: /var/lib/blong/suites/blong-sport/PLACEHOLDER
            type: Directory
          name: suite
        - name: releaserc-home
          secret:
            items:
              - key: .blong_releaserc
                path: .blong_releaserc
            optional: true
            secretName: blong-releaserc
        - name: releaserc-site
          secret:
            items:
              - key: blong_releaserc
                path: blong_releaserc
            optional: true
            secretName: blong-releaserc-etc
