apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: blong-sport-fill
    app.kubernetes.io/managed-by: blong-kustomize
    app.kubernetes.io/name: blong-sport
    app.kubernetes.io/part-of: blong-sport
    app.kubernetes.io/version: 0.1.0
    blong.feasible.one/retention: "3"
    blong.feasible.one/spec-hash: 897ed2dded5d1b8d
    blong.feasible.one/suite-version: 0.1.0
    blong.feasible.one/volume-identity: PLACEHOLDER
  name: blong-sport-fill
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blong-sport-fill-PLACEHOLDER-PLACEHOLDER
        app.kubernetes.io/managed-by: blong-kustomize
        app.kubernetes.io/name: blong-sport
        app.kubernetes.io/part-of: blong-sport
        app.kubernetes.io/version: 0.1.0
    spec:
      containers:
        - command:
            - node
            - /script/fill.mts
          env:
            - name: BLONG_ARTIFACT_ROOT
              value: /var/lib/blong/suites/blong-sport
            - name: BLONG_ARTIFACT_IDENTITY
              value: PLACEHOLDER
            - name: BLONG_ARTIFACT_KEEP
              value: "3"
            - name: BLONG_ARTIFACT_URL
              value: http://blong-artifact.default.svc.cluster.local/sport.zip
          image: docker.io/library/blong-gogo:1
          name: fill
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/blong/suites/blong-sport
              name: suite
            - mountPath: /script
              name: fill-script
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: PLACEHOLDER
      restartPolicy: Never
      serviceAccountName: blong
      volumes:
        - hostPath:
            path: /var/lib/blong/suites/blong-sport
            type: DirectoryOrCreate
          name: suite
        - configMap:
            name: fill-script
          name: fill-script
