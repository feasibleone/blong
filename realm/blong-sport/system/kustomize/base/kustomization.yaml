apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: blong-kustomize
      app.kubernetes.io/name: blong-sport
      app.kubernetes.io/part-of: blong-sport
resources:
  - configmaps/fill-script.yaml
  - deployments/blong-sport.yaml
  - rbac/auth-review-binding.yaml
  - rbac/auth-review.yaml
  - rbac/blong-operator-role.yaml
  - rbac/blong-operator-rolebinding.yaml
  - rbac/jobs-role.yaml
  - rbac/jobs-rolebinding.yaml
  - rbac/service-account.yaml
  - services/access.yaml
  - services/core.yaml
  - services/feedback.yaml
  - services/login.yaml
  - services/party.yaml
  - services/sport.yaml
  - services/web-http.yaml
