apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: blong-chat-fill
    app.kubernetes.io/managed-by: blong-kustomize
    app.kubernetes.io/name: blong-chat
    app.kubernetes.io/part-of: blong-chat
    app.kubernetes.io/version: PLACEHOLDER
    blong.feasible.one/retention: "3"
    blong.feasible.one/spec-hash: ce5171506574467b
    blong.feasible.one/suite-version: PLACEHOLDER
    blong.feasible.one/volume-identity: PLACEHOLDER
  name: blong-chat-fill
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blong-chat-fill-PLACEHOLDER-PLACEHOLDER
        app.kubernetes.io/managed-by: blong-kustomize
        app.kubernetes.io/name: blong-chat
        app.kubernetes.io/part-of: blong-chat
        app.kubernetes.io/version: PLACEHOLDER
    spec:
      containers:
        - command:
            - node
            - /script/fill.mts
          env:
            - name: BLONG_ARTIFACT_ROOT
              value: /var/lib/blong/suites/blong-chat
            - name: BLONG_ARTIFACT_IDENTITY
              value: PLACEHOLDER
            - name: BLONG_ARTIFACT_KEEP
              value: "3"
            - name: BLONG_ARTIFACT_URL
              value: http://blong-artifact.default.svc.cluster.local/chat.zip
          image: PLACEHOLDER
          name: fill
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/blong/suites/blong-chat
              name: suite
            - mountPath: /script
              name: fill-script
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: PLACEHOLDER
      restartPolicy: Never
      serviceAccountName: blong
      volumes:
        - hostPath:
            path: /var/lib/blong/suites/blong-chat
            type: DirectoryOrCreate
          name: suite
        - configMap:
            name: fill-script
          name: fill-script
