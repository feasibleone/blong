apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: blong-chat
    app.kubernetes.io/managed-by: blong-kustomize
    app.kubernetes.io/name: blong-chat
    app.kubernetes.io/part-of: blong-chat
    app.kubernetes.io/version: PLACEHOLDER
    blong.feasible.one/spec-hash: 3b9066ed4dca8281
  name: blong-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: blong-chat
      app.kubernetes.io/part-of: blong-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blong-chat
        app.kubernetes.io/managed-by: blong-kustomize
        app.kubernetes.io/name: blong-chat
        app.kubernetes.io/part-of: blong-chat
        app.kubernetes.io/version: PLACEHOLDER
        blong.feasible.one/namespace-access: "true"
        blong.feasible.one/namespace-chat: "true"
        blong.feasible.one/namespace-core: "true"
        blong.feasible.one/namespace-login: "true"
    spec:
      containers:
        - args:
            - /opt/deploy/suite/realm/blong-chat/index.ts
            - release
            - --remote.canSkipSocket=true
            - --login.orchestrator
            - --login.gateway
            - --core.adapter
            - --core.orchestrator
            - --core.gateway
            - --access.adapter
            - --access.orchestrator
            - --access.gateway
            - --chat.adapter
            - --chat.orchestrator
            - --chat.gateway
            - --srv.orchestrator
          env:
            - name: BLONG_ENV
              value: release
            - name: BLONG_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: PLACEHOLDER
          livenessProbe:
            tcpSocket:
              port: rpc
          name: blong
          ports:
            - containerPort: 8091
              name: rpc
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8095
              name: chat-slack
              protocol: TCP
            - containerPort: 8096
              name: chat-viber
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rpc
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /opt/deploy/suite
              name: suite
              readOnly: true
            - mountPath: /home/node/.blong_releaserc
              name: releaserc-home
              readOnly: true
              subPath: .blong_releaserc
            - mountPath: /etc/blong_releaserc
              name: releaserc-site
              readOnly: true
              subPath: blong_releaserc
            - mountPath: /home/node/.config/blong_release/
              name: gateway-keys
              readOnly: true
      serviceAccountName: blong
      volumes:
        - hostPath:
            path: /opt/deploy/suite
            type: Directory
          name: suite
        - name: releaserc-home
          secret:
            items:
              - key: .blong_releaserc
                path: .blong_releaserc
            optional: true
            secretName: blong-releaserc
        - name: releaserc-site
          secret:
            items:
              - key: blong_releaserc
                path: blong_releaserc
            optional: true
            secretName: blong-releaserc-etc
        - name: gateway-keys
          secret:
            items:
              - key: config
                path: config
            optional: true
            secretName: gateway-keys
