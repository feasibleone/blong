resourceType: access.role
role:
  # No `roleBit` here: a bit is allocated when the role is first created
  # (`MAX(roleBit) + 1`, never reused) by this realm's `access.role.merge`.
  # It is the role's position in a token's `per` permission mask, so it is
  # assigned once and never moves: a fresh database numbers these roles 0..5
  # exactly as a hand-written table did, while adding a role here can no longer
  # collide with — or silently destroy — an existing one.
  - description: Admin role with full access
    name: Admin
  - description: Office Manager role with limited access
    name: Manager
  - description: Customer Service role with limited access
    name: Customer Service
  - description: Customer role with limited access
    name: Customer
  - description: Self-registered guest role with basic access rights
    name: Guest
  # Test-only role used by `meta/dbTest/accessAuthorizationMerge.yaml` to prove
  # the login-eligibility gate refuses login/refresh (its role grants no
  # `accessLogin` action).
  - description: Role with no login capability (test-only)
    name: NoLogin
