role:
  Guest: guestBasic,loginCapability
  # Well-known `Admin` role grants the right to log in (`loginCapability` →
  # `accessLogin`).  Because this is the SHARED production seed, any realm that
  # grants a user the `Admin` role gets login eligibility for free — realm
  # seeds only MERGE their own capabilities into this role, never repeat it.
  # It also carries `translationManage`, the right to edit the dictionary itself.
  Admin: testManagement,accessModelAdmin,loginCapability,blongRealmRead,translationManage
  Manager: loginCapability
  Customer: loginCapability
  # No `login` capability → the user cannot establish/renew a session
  # (the login-eligibility gate is always on).
  NoLogin: guestBasic

capability:
  guestBasic: accessTestGuest,access.profile.get
  # The framework realm's reads, contributed by `core/blong-realm` — the seed lives
  # here because the method it dispatches to (`access.authorization.merge`) is
  # blong-access's, and a realm that ships no `adapter/db` cannot process its own
  # seed asset: in a suite that loads the realm it was dispatched to the *generic*
  # knex merge instead, which expects an array of rows under the object key and
  # therefore read `rows` from an undefined and killed the process at boot.
  #
  # Capability entries are the CALLED METHOD NAMES, dotted — not the handler names.
  # `gateway.authorize` checks the method the request asked for, so a list of
  # non-dotted handler names grants nothing at all: every read is refused, each
  # page renders its error dialog, and the screenshots look like a broken realm.
  blongRealmRead: >-
    blong.flow.find,blong.flow.get,blong.template.find,
    blong.search.find,blong.digest.get,blong.incident.find
  # The well-known `accessLogin` action — grants the right to establish/renew a
  # session (the login-eligibility gate is always on).  Grant it to any other
  # role that may log in.
  #
  # The dictionary reads ride along, because a translation is not a privilege: every
  # screen a caller with a session reaches is rendered through the same labels, and a
  # caller refused `core.label.list` sees the whole UI in English. `blong-core` cannot
  # ship this list itself — it is a library realm with no `adapter/db`, so a seed asset
  # of its own would be dispatched to the generic knex merge and fail at boot (the same
  # reason `blongRealmRead` lives here). `@@D-635`
  loginCapability: >-
    accessLogin,
    core.label.list,core.translation.list,
    feedback.session.add
  # Editing the dictionary is a privilege and stays with the administrator: the two
  # pages that write it are `core.label` and `core.translation` model pages, and they
  # need the reads their browse and open views make as well.
  translationManage: >-
    core.label.list,core.label.find,core.label.get,
    core.label.add,core.label.edit,core.label.remove,
    core.translation.list,core.translation.find,core.translation.get,
    core.translation.add,core.translation.edit,core.translation.remove
  testManagement: accessTestPrivate,subject.object.schema
  # Grants the Admin role (testAdmin / testUser) every action the access UI
  # models need, so the Playwright suite can browse/create/edit the entities
  # and load schemas + dropdowns through the authorized gateway.
  accessModelAdmin: >-
    accessUserFind,accessUserGet,accessUserAdd,accessUserEdit,accessUserRemove,
    accessRoleFind,accessRoleGet,accessRoleAdd,accessRoleEdit,accessRoleRemove,
    accessCapabilityFind,accessCapabilityGet,accessCapabilityAdd,accessCapabilityEdit,accessCapabilityRemove,
    accessActionFind,accessPolicyFind,accessFlowFind,accessAccessFind,
    accessSessionFind,accessSessionClose,accessAuditFind,
    accessAclFind,accessAclGet,accessAclAdd,accessAclEdit,accessAclRemove,accessAclList,
    accessDropdownList,subject.object.schema
policy:
  password:
    credentialType: password
    minLength: 8
    requireSpecialChar: false
    requireNumber: false
    requireUppercase: false
    maxAgeDays: 90
    maxAttempts: 5
    credentialParams:
      # No `iterations` here on purpose: the environment supplies it from
      # `config.db.password`, so production derives with 100000 and dev/CI with a
      # single iteration (see `realm/blong-access/server.ts`).  The value used is
      # stored on each credential, so verification never has to guess it.
      function: hash
      algorithm: pbkdf2
      keyLength: 64
      digest: sha512
    isActive: 1

# Record-level ACL: the Admin role is granted every guarded action on ALL records
# (`target: '*'` stores the rule with `targetKind: all`), so an administrator is
# never narrowed by the record-level ACL — including records created later, which
# no scope could cover yet.  A `deny` rule still wins over it: the party realm's
# test seed uses exactly that to hide one organization from the admin as well.
# List the guarded actions here as realms opt their tables in.
acl:
  - principal: Admin
    principalType: role
    target: '*'
    effect: allow
    actions: >-
      party.person.find,party.person.get,party.person.add,party.person.edit,party.person.remove,
      party.unit.find,party.unit.get,party.unit.add,party.unit.edit,party.unit.remove,
      party.organization.find,party.organization.get,party.organization.add,
      party.organization.edit,party.organization.remove
