user:
  testUser:
    password: testPassword
    emailAddress: testUser@example.com
    roles: Admin
  testAdmin:
    password: testPassword
    emailAddress: testAdmin@example.com
    roles: Admin
  testViewer:
    password: testPassword
    emailAddress: testViewer@example.com
    roles: Customer
  testGuest:
    password: testPassword
    emailAddress: testGuest@example.com
    roles: Guest
  # Has valid credentials but its role grants NO `login` action — used to prove
  # the login-eligibility gate refuses login/refresh (the gate is always on).
  testNoLogin:
    password: testPassword
    emailAddress: testNoLogin@example.com
    roles: NoLogin
role:
  Admin: testManagement,accessModelAdmin,loginCapability,blongRealmRead
  Customer: loginCapability
  Guest: guestBasic,loginCapability
  # No `login` capability → the user cannot establish/renew a session
  # (the login-eligibility gate is always on).
  NoLogin: guestBasic
capability:
  testManagement: accessTestPrivate,subject.object.schema
  # Grants the Admin role (testAdmin / testUser) every action the access UI
  # models need, so the Playwright suite can browse/create/edit the entities
  # and load schemas + dropdowns through the authorized gateway.
  accessModelAdmin: >-
    accessUserFind,accessUserGet,accessUserAdd,accessUserEdit,accessUserRemove,
    accessRoleFind,accessRoleGet,accessRoleAdd,accessRoleEdit,accessRoleRemove,
    accessCapabilityFind,accessCapabilityGet,accessCapabilityAdd,accessCapabilityEdit,accessCapabilityRemove,
    accessActionFind,accessPolicyFind,accessFlowFind,accessAccessFind,
    accessSessionFind,accessSessionClose,accessAuditFind,
    accessAclFind,accessAclGet,accessAclAdd,accessAclEdit,accessAclRemove,accessAclList,
    accessDropdownList,subject.object.schema
  # The framework realm's reads (see `meta/db/accessAuthorizationMerge.yaml`): the
  # diagram pages list flows, templates, search results, the change digest and
  # incidents. `testViewer` (Customer) and `testGuest` (Guest) get none of it,
  # which is what lets the realm's own spec assert a 403 rather than an empty page.
  blongRealmRead: >-
    blong.flow.find,blong.flow.get,blong.template.find,
    blong.search.find,blong.digest.get,blong.incident.find

  # The well-known `accessLogin` action — grants the right to establish/renew
  # a session. Every role that may log in must grant it (the gate is always on).
  loginCapability: accessLogin
