# A TEST seed: every list it declares is the complete one for the capability or user it names, so
# `replace` retracts the edges a shortened list dropped (F-357).  Roles stay additive — a shared
# role's capability list is a union several files contribute to (see access.authorization.merge).
replace: true
user:
  testUser:
    password: testPassword
    emailAddress: testUser@example.com
    roles: Admin
  testAdmin:
    password: testPassword
    emailAddress: testAdmin@example.com
    roles: Admin
  # The Storybook toolbar's Manager option logs in as this user; `Manager` is a
  # seeded production role (meta/db/1-accessRoleMerge.yaml) that would otherwise
  # have no capabilities and therefore be denied every call.
  testManager:
    password: testPassword
    emailAddress: testManager@example.com
    roles: Manager
  testViewer:
    password: testPassword
    emailAddress: testViewer@example.com
    roles: Customer
  testGuest:
    password: testPassword
    emailAddress: testGuest@example.com
    roles: Guest
  # Has valid credentials but its role grants NO `login` action — used to prove
  # the login-eligibility gate refuses login/refresh (the gate is always on).
  testNoLogin:
    password: testPassword
    emailAddress: testNoLogin@example.com
    roles: NoLogin
