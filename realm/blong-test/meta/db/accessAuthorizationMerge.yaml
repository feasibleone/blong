# The Test runs console's server-side methods live in this realm, so their permission is seeded
# here too. This is a PRODUCTION seed: the `Admin` role is a production role and the capability is
# what the console needs, so the grant holds for every deployment — only the local test accounts
# holding `Admin` live in `meta/dbTest`. The role's capability list is additive, so this file only
# adds `testRunServer` to it; `replace` keeps that one capability's action list authoritative.
replace: true
role:
  Admin: testRunServer
  # The Test runs console's own roles (`@@D-778`): the one capability it has is a
  # management one, so Customer and Guest hold the login gate alone.
  Test Admin: testRunServer,loginCapability
  Test Manager: testRunServer,loginCapability
  Test Customer: loginCapability
  Test Guest: loginCapability
capability:
  testRunServer: test.run.start,test.run.eventFind,test.run.snapshotGet,test.run.cancel
