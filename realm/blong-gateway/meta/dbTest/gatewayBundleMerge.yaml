# Test seed — demo bundles, so the management pages have something to browse in a dev or CI run.
#
# A bundle IS an `access.role` (its `roleBit` is the bit its subscribers carry), so these rows also
# create the `vision` and `customer` roles their subscriptions refer to. Nothing here is production
# provisioning: the capability that lets an administrator manage bundles and subscriptions is
# `gatewayManagement`, granted to the `Admin` role by the production seed
# (`meta/db/accessAuthorizationMerge.yaml`), which a release or upgrade process dispatches too.
bundle:
  Vision AI:
    roleBit: 100
    capability: vision
    actions: vision.compute
    baseMonthlyCredits: 1000
    rateLimit: 100
    rateWindowSec: 60
    isActive: true
    description: Vision processing API (test)
  Customer API:
    roleBit: 101
    capability: customer
    actions: customer.get
    baseMonthlyCredits: 500
    rateLimit: 60
    rateWindowSec: 60
    isActive: true
    description: Customer data API (test)
