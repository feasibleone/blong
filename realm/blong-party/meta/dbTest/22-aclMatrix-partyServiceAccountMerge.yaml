# ACL matrix fixture — service accounts.
#
# One service account per organization and per unit: an `access_user` profile on
# the party resource ITSELF (so the profile's `userId` IS the organization's or
# unit's `resourceId`), carrying a `clientId` and a `clientSecret` credential,
# and a role through `hasRole`.  Authentication is the OAuth `client_credentials`
# grant, so no session is created; authorization then runs down the same
# role → `hasScope` path as the person users of `21-...`.
#
# The `clientId` is a distinct string rather than the resource name by design —
# the resource name belongs to the party hierarchy — which is why the profile
# carries one.
#
# Dispatched by the last `-` segment of the basename: `partyServiceAccountMerge`
# → `party.service.account.merge`.
serviceAccount:
  # An organization is its own scope, so an organization account needs a grant
  # naming it.
  - resource: Axis
    typeAlias: party.organization
    clientId: axis-sa
    role: svcAxisOrg
  # A unit's scope set is the organization it belongs to — `belongsTo` is a
  # unit's only scope predicate — so this grant reaches the PERSONS in North and
  # South (they belong to a unit that isPartOf Axis HQ) and no unit record at
  # all.  What reaches the units is the organization's own grant below.
  - resource: Axis HQ
    typeAlias: party.unit
    clientId: axis-hq-sa
    role: svcAxisHq
  - resource: North
    typeAlias: party.unit
    clientId: north-sa
    role: svcNorth
  # South's branch is what remains when only Axis is declared above it.
  - resource: South
    typeAlias: party.unit
    clientId: south-sa
    role: svcSouth
  # Login only — every read is refused by RBAC (the `🚫` row).  Beta carries no
  # role, so East (which belongs to it) inherits nothing from it.
  - resource: Beta
    typeAlias: party.organization
    clientId: beta-sa
    role: svcNone
  - resource: East
    typeAlias: party.unit
    clientId: east-sa
    role: svcEast
# Shared secret for the fixture — a fixed, test-only value the matrix can present.
secret: testClientSecret
