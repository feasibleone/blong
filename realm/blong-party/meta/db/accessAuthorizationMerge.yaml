role:
  Admin: organizationView,organizationEdit,organizationDelete,personView,personEdit,personDelete,unitView,unitEdit,unitDelete,consentView,consentEdit,consentDelete
  # Party's own roles (`@@D-778`): the three capabilities per object collapse into
  # the usual ladder — Admin changes and deletes, Manager changes, Customer and
  # Guest read. `loginCapability` is the login gate, not a party grant.
  Party Admin: organizationView,organizationEdit,organizationDelete,personView,personEdit,personDelete,unitView,unitEdit,unitDelete,consentView,consentEdit,consentDelete,loginCapability
  Party Manager: organizationView,organizationEdit,personView,personEdit,unitView,unitEdit,consentView,consentEdit,loginCapability
  Party Customer: organizationView,personView,unitView,consentView,loginCapability
  Party Guest: organizationView,personView,unitView,consentView,loginCapability
capability:
  organizationView: party.organization.find,party.organization.get
  organizationEdit: party.organization.edit,party.organization.add
  organizationDelete: party.organization.remove
  personView: party.person.find,party.person.get
  personEdit: party.person.edit,party.person.add
  personDelete: party.person.remove
  unitView: party.unit.find,party.unit.get
  unitEdit: party.unit.edit,party.unit.add
  unitDelete: party.unit.remove
  # Consent is a party object like the other three and its page sits in the menu
  # every deployment shows, so it is granted the same way. A database seeded
  # before these lines keeps the Admin role without them and the page answers
  # 403 on a read the menu already offers.
  consentView: party.consent.find,party.consent.get
  consentEdit: party.consent.edit,party.consent.add
  consentDelete: party.consent.remove
