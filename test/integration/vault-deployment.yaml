apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.16
        args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200", "-dev-kv-v1"]
        ports:
        - containerPort: 8200
          name: vault
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "root"
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: "0.0.0.0:8200"
        - name: VAULT_ADDR
          value: "http://0.0.0.0:8200"
        resources:
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: "0.1"
            memory: 128Mi
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
    nodePort: 30002
    name: vault
  type: NodePort
---
# Seed the KV v1 `secret/commander-demo` used by the commander explorer drill
# (vault-dev source). The vault server runs `-dev-kv-v1`, so `vault kv put`
# writes directly under `secret/`. Deterministic content → the secret viewer
# screenshot shows fixed keys/values in CI and locally.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-seed-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-vault
        image: busybox:1.36.1
        command: ["sh", "-c", "until wget -q -O- http://vault:8200/v1/sys/health?standbyok=true; do sleep 2; done"]
      containers:
      - name: seed
        image: hashicorp/vault:1.16
        env:
        - name: VAULT_ADDR
          value: http://vault:8200
        - name: VAULT_TOKEN
          value: root
        command:
        - sh
        - -c
        - |
          vault kv put secret/commander-demo username=commander-demo-user password=commander-demo-password note=commander-demo-secret &&
          echo "Vault secret commander-demo written"
        resources:
          requests:
            cpu: "0.01"
            memory: "16Mi"
          limits:
            cpu: "0.1"
            memory: 64Mi
