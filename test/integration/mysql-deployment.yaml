apiVersion: v1
kind: Namespace
metadata:
  name: blong-integration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS `blong`;
    FLUSH PRIVILEGES;
    CREATE USER 'sa'@'%' IDENTIFIED BY 'password';
    GRANT ALL ON *.* TO 'sa'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
      - name: volume-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 999:999 /var/lib/mysql"]
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      containers:
      - name: mysql
        image: mysql/mysql-server:latest
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_USER
          value: "test"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "blong"
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "true"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          limits:
            cpu: "1.0"
            memory: 768Mi
          requests:
              cpu: "0.5"
              memory: 512Mi
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - mysql
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 10
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: mysql-init
        configMap:
          name: mysql-init-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30006
    name: mysql
  type: NodePort
