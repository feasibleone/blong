apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-04-18T19-09-19Z
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: minio-api
        - containerPort: 9001
          name: minio-console
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        resources:
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: "0.1"
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30009
    name: minio-api
  type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-minio
        image: busybox:1.36.1
        command: ["sh", "-c", "until wget -q -O- http://minio:9000/minio/health/live; do sleep 2; done"]
      containers:
      - name: mc
        image: minio/mc:RELEASE.2024-04-18T16-45-29Z
        command:
        - sh
        - -c
        - |
          mc alias set local http://minio:9000 minioadmin minioadmin &&
          mc mb --ignore-existing local/blong-integration &&
          echo "Bucket blong-integration created"
        resources:
          limits:
            cpu: "0.1"
            memory: 64Mi
