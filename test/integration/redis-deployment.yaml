# Redis for API Gateway metering tests (blong-gateway).
# Exposed on host 127.0.0.1:6379 via the k3d NodePort mapping
#   -p "6379:30063@agent:0:direct"
# No persistence: integration tests start from a fresh metering state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        args: ["redis-server", "--appendonly", "no"]
        resources:
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: "0.25"
            memory: 128Mi
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30063
    name: redis
  type: NodePort
---
# Seed the commander explorer redis keys (`commander:demo` / `commander:greeting`)
# so the redis-dev drill + keys screenshot show deterministic data in CI + locally.
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-seed-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-redis
        image: redis:7-alpine
        command: ["sh", "-c", "until redis-cli -h redis ping > /dev/null 2>&1; do sleep 2; done"]
      containers:
      - name: seed
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          redis-cli -h redis SET commander:demo 'hello from commander:demo' &&
          redis-cli -h redis SET commander:greeting 'hello from commander:greeting' &&
          echo "Redis commander keys seeded"
        resources:
          requests:
            cpu: "0.01"
            memory: "16Mi"
          limits:
            cpu: "0.1"
            memory: 64Mi
