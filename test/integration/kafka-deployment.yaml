apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 29092
          name: kafka-internal
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: CLUSTER_ID
          value: "M2ZkNjIwMjYwNTFiNGJhOG"
        resources:
          limits:
            cpu: "1.0"
            memory: 768Mi
          requests:
            cpu: "0.25"
            memory: 256Mi
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - |
                until kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1; do
                  sleep 3
                done
                kafka-topics --bootstrap-server localhost:9092 \
                  --create --if-not-exists \
                  --topic blong-integration \
                  --partitions 1 \
                  --replication-factor 1
                # The seed lives here and nowhere else: this hook runs on every container
                # start, including the first, and this container keeps no volume, so every
                # restart loses the topic's messages and the hook recreates an *empty* topic —
                # by which time the one-shot Job has long since run, leaving the topic empty
                # for every reader (the commander's message level read empty for exactly that
                # reason, D-498). The Job used to seed too; two read-then-produce guards race
                # on a fresh cluster and append the message twice. Guarding on the message
                # rather than on the topic keeps this idempotent, and the partition/offset read
                # is deliberate: it avoids the broker's `group.initial.rebalance.delay.ms`
                # (3s) that makes a group-based consumer exit before reading anything and look
                # like "no seed present".
                seed=$(kafka-console-consumer --bootstrap-server localhost:9092 \
                         --topic blong-integration --partition 0 --offset 0 --timeout-ms 5000 \
                         2>/dev/null | grep -c '"kind":"commander"' || true)
                if [ "${seed:-0}" -gt 0 ]; then
                  echo "Seed message already present, leaving the topic untouched"
                else
                  printf '{"kind":"commander","message":"hello from blong-integration"}\n' | \
                    kafka-console-producer --bootstrap-server localhost:9092 \
                      --topic blong-integration
                  echo "Seeded blong-integration with the commander demo message"
                fi
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    nodePort: 30092
    name: kafka
  - port: 29092
    targetPort: 29092
    name: kafka-internal
  type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:7.6.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1; do
            echo "Waiting for Kafka..."; sleep 3
          done
      containers:
      - name: create-topic
        image: confluentinc/cp-kafka:7.6.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          # The topic only; the seed message is the postStart hook's job.
          #
          # Both used to seed: each reads whether a seed message exists and then
          # produces one if not, so when they ran together — which is what a fresh
          # cluster does — both read zero and both wrote, and the commander's
          # kafka-messages shot carried two identical rows. Nothing makes that
          # read-then-produce pair atomic. The hook alone is sufficient and
          # correct: it runs on every container start, including the first, and
          # re-seeds a topic that a broker restart recreated empty (the broker
          # keeps no PersistentVolumeClaim). See the hook's own comment.
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic blong-integration \
            --partitions 1 \
            --replication-factor 1
        resources:
          requests:
            cpu: "0.01"
            memory: "32Mi"
          limits:
            cpu: "0.1"
            memory: 128Mi
