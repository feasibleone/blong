# The dev/CI Kafka every realm's adapter points at.
#
# The broker keeps its log on a PersistentVolumeClaim. The topics and the records in them are what a
# suite reads back, and a broker with no volume came up empty after every restart — the commander's
# explorer found its topic with no rows and the agent's telemetry lost the session it had just
# written (`@@D-1002`).
#
# The topics themselves are NOT provisioned here. A realm declares the topics it reads or writes in
# its own `meta/kafka/*.yaml`, and the kafka adapter provisions them at start — in `dev`, and in the
# `upgrade` Job a deployment runs (`@@D-1001`). A declaration that needs a message to read carries
# it as a seed, produced only when the topic does not already hold that row, so the demo row the
# commander's explorer shows is written once and a restart adds no copy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  # One ReadWriteOnce volume cannot be mounted by two pods: a rolling update would leave the new pod
  # waiting for the old one to let go of it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 29092
          name: kafka-internal
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        # The image's default, named here because it is the mount below: the log directory is what
        # a claim has to keep for the topics to survive a restart. In combined broker/controller mode
        # the metadata log lives in the same directory — `metadata.log.dir` must not be set at all.
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        # Topics are declared by the realms that use them, never by a produce to a name nothing
        # declared: an auto-created topic has one partition and no retention, which is a shape the
        # suite that reads it never asked for (`@@D-1001`).
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: CLUSTER_ID
          value: "M2ZkNjIwMjYwNTFiNGJhOG"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        resources:
          limits:
            cpu: "1.0"
            memory: 768Mi
          requests:
            cpu: "0.25"
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    nodePort: 30092
    name: kafka
  - port: 29092
    targetPort: 29092
    name: kafka-internal
  type: NodePort
