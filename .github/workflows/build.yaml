name: Build
run-name: Build => ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
    # A pull request whose only changes are the rebuilt metrics/history baseline
    # skips CI entirely. The CI run itself commits those files back onto the pull
    # request branch; that commit carries `[skip ci]`, because a `paths-ignore`
    # filter cannot help once the branch also holds code changes.
    paths-ignore:
      - .github/metrics.json
      - .github/history.jsonl

jobs:
  build:
    permissions:
      # commit-metrics pushes the baseline files to the pull request branch.
      contents: write
      packages: write
      security-events: write
      pull-requests: write
    uses: infitx-org/actions/.github/workflows/rush.yaml@main
    with:
      ci-test-jobs: 2
    secrets:
      REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
