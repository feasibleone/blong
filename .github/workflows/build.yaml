name: Build
run-name: Build => ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
      packages: write
      security-events: write
      pull-requests: write
    uses: infitx-org/actions/.github/workflows/rush.yaml@main
    secrets:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  storybook-tests:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: core/blong-ui
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: |
            common/temp
            core/**/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Rush Install
        run: node ../../common/scripts/install-run-rush.js install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Storybook visual + interaction tests
        run: node ../../common/scripts/install-run-rush.js ci-storybook --to @feasibleone/blong-ui
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: storybook-snapshot-diffs
          path: core/blong-ui/stories/__snapshots__/__diff_output__/
          retention-days: 7
