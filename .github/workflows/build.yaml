name: Build
run-name: Build => ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
    # A pull request whose only changes are the rebuilt metrics/history baseline
    # skips CI entirely. CI never commits those files onto the pull request branch —
    # the reusable workflow stacks them on a `metrics/` branch of their own — so
    # this only fires for a pull request that carries nothing else.
    paths-ignore:
      - .github/metrics.json
      - .github/history.jsonl

jobs:
  build:
    permissions:
      # contents:write pushes the stacked metrics branch; pull-requests:write opens
      # the pull request that carries it onto the branch under test.
      contents: write
      packages: write
      security-events: write
      pull-requests: write
    uses: infitx-org/actions/.github/workflows/rush.yaml@main
    with:
      ci-test-jobs: 2
    secrets:
      REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
