name: Deploy

# A release is the deployment decision: release-please publishes a
# `<component>-v<version>` release, and this workflow builds that component's
# artifact, attaches it to the release and asks the operator to converge.
# `workflow_dispatch` is the same path for a re-deploy or a deployment whose
# release was published by an earlier runner.
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            deployment:
                description: Deployment alias from .github/deployments.json
                required: true
                type: string
            tag:
                description: Release tag to deploy (defaults to the latest release)
                required: false
                type: string

# One deployment at a time per alias. The alias is not known until `resolve`
# runs, so the release tag (or the dispatch's alias) is the key; a second run
# waits rather than replacing the first mid-apply.
concurrency:
    group: deploy-${{ github.event.release.tag_name || inputs.deployment || github.run_id }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    resolve:
        name: Resolve the deployment
        runs-on: ubuntu-latest
        outputs:
            alias: ${{ steps.resolve.outputs.alias }}
            tag: ${{ steps.resolve.outputs.tag }}
            version: ${{ steps.resolve.outputs.version }}
            package: ${{ steps.resolve.outputs.package }}
            scenario: ${{ steps.resolve.outputs.scenario }}
            artifact: ${{ steps.resolve.outputs.artifact }}
            namespace: ${{ steps.resolve.outputs.namespace }}
            suite: ${{ steps.resolve.outputs.suite }}
            framework_version: ${{ steps.resolve.outputs.framework_version }}
            framework_image: ${{ steps.resolve.outputs.framework_image }}
            artifact_url: ${{ steps.resolve.outputs.artifact_url }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The release's own tree for a release run, the dispatch tag when one
                  # is named, and the default branch otherwise — the deployment map is
                  # read from whichever tree the caller asked about.
                  ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
                  fetch-depth: 0

            - name: Read the tag, alias and framework version
              id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_TAG: ${{ github.event.release.tag_name }}
                  INPUT_DEPLOYMENT: ${{ inputs.deployment }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  tag="${INPUT_TAG:-${EVENT_TAG}}"
                  if [ -z "$tag" ]; then
                      tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
                  fi
                  if [ -z "$tag" ]; then
                      echo "::error::no release tag to deploy"
                      exit 1
                  fi

                  alias="${INPUT_DEPLOYMENT}"
                  if [ -z "$alias" ]; then
                      alias=$(jq -r --arg tag "$tag" \
                          'to_entries[]
                           | select(.value.installer != true)
                           | select(.value.release as $release | $tag | startswith($release + "-v"))
                           | .key' .github/deployments.json | head -n1)
                  fi
                  if [ -z "$alias" ]; then
                      # One release fires this workflow for every component release-please publishes,
                      # and it publishes the batch at once: most of those tags name no deployment, and
                      # their own pipelines are the ones that run. Saying so and stopping is the
                      # difference between a green release and a red one per component nobody deploys.
                      if [ -n "${EVENT_TAG:-}" ]; then
                          echo "::notice::$tag names no deployment in .github/deployments.json; nothing to deploy"
                          echo "alias=" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                      echo "::error::no deployment named and none could be resolved"
                      exit 1
                  fi

                  release=$(jq -r --arg alias "$alias" '.[$alias].release' .github/deployments.json)
                  version="${tag#"${release}-v"}"
                  if [ "$version" = "$tag" ]; then
                      echo "::error::$tag is not a $release-v<version> release"
                      exit 1
                  fi

                  gogo=$(git show "$tag:.release-please-manifest.json" \
                      | jq -r '."core/blong-gogo"')
                  if [ -z "$gogo" ] || [ "$gogo" = "null" ]; then
                      echo "::error::$tag does not carry a core/blong-gogo version"
                      exit 1
                  fi

                  artifact=$(jq -r --arg alias "$alias" '.[$alias].artifact' .github/deployments.json)
                  {
                      echo "alias=$alias"
                      echo "tag=$tag"
                      echo "version=$version"
                      echo "package=$(jq -r --arg alias "$alias" '.[$alias].package' .github/deployments.json)"
                      echo "scenario=$(jq -r --arg alias "$alias" '.[$alias].scenario' .github/deployments.json)"
                      echo "artifact=$artifact"
                      echo "namespace=$(jq -r --arg alias "$alias" '.[$alias].namespace' .github/deployments.json)"
                      echo "suite=$(jq -r --arg alias "$alias" '.[$alias].suite' .github/deployments.json)"
                      echo "framework_version=v$gogo"
                      echo "framework_image=ghcr.io/feasibleone/blong-gogo"
                      echo "artifact_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$artifact"
                  } >> "$GITHUB_OUTPUT"

            - name: Wait for the framework image
              if: steps.resolve.outputs.alias != ''
              env:
                  FRAMEWORK_IMAGE: ${{ steps.resolve.outputs.framework_image }}
                  FRAMEWORK_VERSION: ${{ steps.resolve.outputs.framework_version }}
              run: |
                  set -euo pipefail
                  image="${FRAMEWORK_IMAGE}:${FRAMEWORK_VERSION}"
                  echo "waiting for $image"
                  for _ in $(seq 1 90); do
                      if docker manifest inspect "$image" >/dev/null 2>&1; then
                          echo "$image is published"
                          exit 0
                      fi
                      sleep 10
                  done
                  echo "::error::$image was not published within ten minutes"
                  exit 1

    artifact:
        name: Build and attach the artifact
        needs: resolve
        # A release that names no deployment resolved an empty alias and stopped; its jobs are skipped
        # rather than failed, which is what keeps the workflow green on every component release.
        if: needs.resolve.outputs.alias != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            digest: ${{ steps.zip.outputs.digest }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.tag }}
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # The install is this job's largest cost and it buys the framework's dev dependency
            # tree rather than anything the artifact runs: 197 s measured on 2026-11-12 (run
            # 43207810220), most of it node-rdkafka's native build inside `blong-gogo`, which the
            # zip does not carry at all — the deploy tree is the scenario's twelve production
            # packages. The store the shared CI workflow publishes is what a warm install needs,
            # so this job restores it and leaves the writing to CI's `setup` (@@D-546 @@D-830).
            #
            # The `*/.rush` trees are deliberately not restored: they carry the build cache, and a
            # hit there against a checkout with no `dist` reports every project as already built —
            # the stale output of @@F-555 arriving in an artifact instead of in a test.
            - name: Restore the pnpm store
              uses: actions/cache/restore@v5
              with:
                  path: common/temp/deps.tar.zst
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-

            - name: Unpack the pnpm store
              run: |
                  set -euo pipefail
                  if [ -f common/temp/deps.tar.zst ]; then
                      zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
                  else
                      echo 'No deps.tar.zst in the restored archive; the install builds the store.'
                  fi

            - name: Install
              run: node common/scripts/install-run-rush.js install

            # The first deploy answers what the zip carries — its project list is
            # `extractor-metadata.json` — and costs two seconds; the second one, after the build,
            # is what puts the fresh `dist` trees in it (@@D-830).
            - name: Deploy the scenario, to read what it carries
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ needs.resolve.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy" \
                      --overwrite

            # `--to <package>` follows the realm's devDependencies, so it built 27 projects for an
            # artifact of 12 — the tap, storybook and browser tooling among them (@@D-830). The
            # scenario's list is the set whose output the artifact can use: build that.
            - name: Build what the artifact carries
              env:
                  # No deployed process reads the framework's declaration bundle (@@D-831).
                  BLONG_SKIP_DTS: 1
              run: |
                  set -euo pipefail
                  mapfile -t projects < <(jq -r '.projects[].projectName' "$RUNNER_TEMP/deploy/extractor-metadata.json")
                  args=()
                  for project in "${projects[@]}"; do args+=("--only=$project"); done
                  echo "building ${#projects[@]} project(s): ${projects[*]}"
                  node common/scripts/install-run-rush.js build "${args[@]}"

            - name: Deploy the scenario
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ needs.resolve.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy" \
                      --overwrite

            - name: Zip it and hash it
              id: zip
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP/deploy"
                  # The artifact is the whole deployment scenario: the entry, the realms
                  # it carries and the browser bundle, because the operator mounts this
                  # directory and runs the entry inside it.
                  zip -qr "$RUNNER_TEMP/${{ needs.resolve.outputs.artifact }}" .
                  digest=$(sha256sum "$RUNNER_TEMP/${{ needs.resolve.outputs.artifact }}" | awk '{print $1}')
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "sha256=$digest"

            - name: Attach it to the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ needs.resolve.outputs.tag }}" \
                      "$RUNNER_TEMP/${{ needs.resolve.outputs.artifact }}" \
                      --clobber

    operator-artifact:
        name: Build and attach the operator artifact
        # The deployment realm is not a tenant's suite: its own release publishes the artifact the
        # operator runs *itself* from, so the job answers the realm's tag and nothing else — a
        # `blong-kustomize-v<version>` release is what an installer points `OPERATOR_ARTIFACT_URL`
        # at, and what `realm/blong-kustomize/deploy.sh` resolves in its release form (@@D-654).
        if: startsWith(github.event.release.tag_name, 'blong-kustomize-v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Same store cache as the tenant artifact job, and for the same reason: the operator's
            # artifact is `blong-kustomize` and its production dependencies, while the install
            # pays for the framework's whole dev tree (175 s in run 43207804416) (@@D-546 @@D-830).
            # Only CI's `setup` writes this key, and its `*/.rush` trees stay out of the restore so
            # that this checkout cannot inherit a build cache with no `dist` behind it (@@F-555).
            - name: Restore the pnpm store
              uses: actions/cache/restore@v5
              with:
                  path: common/temp/deps.tar.zst
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-

            - name: Unpack the pnpm store
              run: |
                  set -euo pipefail
                  if [ -f common/temp/deps.tar.zst ]; then
                      zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
                  else
                      echo 'No deps.tar.zst in the restored archive; the install builds the store.'
                  fi

            - name: Install
              run: node common/scripts/install-run-rush.js install

            # The coordinates live in `.github/deployments.json`, beside the deployments, because that
            # is the one place a release reads them from — and `deploy.sh` reads the same record, so
            # the two cannot disagree about the release prefix or the artifact's name.
            - name: Read the installer record
              id: record
              run: |
                  set -euo pipefail
                  tag="${{ github.event.release.tag_name }}"
                  entry=$(jq -c '.operator' .github/deployments.json)
                  release=$(jq -r '.release' <<<"$entry")
                  version="${tag#"${release}-v"}"
                  if [ "$version" = "$tag" ]; then
                      echo "::error::$tag is not a $release-v<version> release"
                      exit 1
                  fi
                  echo "package=$(jq -r '.package' <<<"$entry")" >> "$GITHUB_OUTPUT"
                  echo "scenario=$(jq -r '.scenario' <<<"$entry")" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  # Two names for one file, because they answer two questions: the versioned one is
                  # what a version installs and cannot be overwritten by the next release, and the
                  # stable one is what `operator-entry.ts` already names as its default
                  # (`releases/latest/download/blong-kustomize.zip`).
                  echo "versioned=$(jq -r '.artifact' <<<"$entry" | sed "s/\.zip$/-$version.zip/")" >> "$GITHUB_OUTPUT"
                  echo "alias=$(jq -r '.artifact' <<<"$entry")" >> "$GITHUB_OUTPUT"

            # The first deploy answers what the artifact carries — `extractor-metadata.json`
            # lists the projects the operator scenario ships — and costs a second; the second one,
            # after the build, is what puts the fresh `dist` trees in it (@@D-830).
            - name: Deploy the operator scenario, to read what it carries
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ steps.record.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy-operator" \
                      --overwrite

            # `--to <package>` follows the realm's devDependencies, so it built the test and
            # storybook tooling the operator never runs (@@D-830). Build what the artifact carries,
            # and skip the framework's declaration bundle — no deployed process reads it (@@D-831).
            - name: Build the realm
              env:
                  BLONG_SKIP_DTS: 1
              run: |
                  set -euo pipefail
                  mapfile -t projects < <(jq -r '.projects[].projectName' "$RUNNER_TEMP/deploy-operator/extractor-metadata.json")
                  args=()
                  for project in "${projects[@]}"; do args+=("--only=$project"); done
                  echo "building ${#projects[@]} project(s): ${projects[*]}"
                  node common/scripts/install-run-rush.js build "${args[@]}"

            - name: Deploy the operator scenario
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ steps.record.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy-operator" \
                      --overwrite

            - name: Zip it and hash it
              id: zip
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP/deploy-operator"
                  # The operator runs this directory: the realm's entry (`operator-entry.ts`), the
                  # framework it carries and the link script's relative links — which is what makes
                  # the cache it is unpacked into readable from wherever it is mounted (D-476).
                  zip -qr "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" .
                  cp "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" \
                     "$RUNNER_TEMP/${{ steps.record.outputs.alias }}"
                  digest=$(sha256sum "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" | awk '{print $1}')
                  # The digest travels as an asset rather than as a sentence in the release body,
                  # because it is read by a script: `deploy.sh` fetches it so the operator's cache and
                  # volume identity follow the artifact rather than its version (D-469), and nothing
                  # has to download and hash the zip to find out what it is.
                  echo "$digest  ${{ steps.record.outputs.versioned }}" \
                      > "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}.sha256"
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "sha256=$digest"

            - name: Attach them to the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}.sha256" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.alias }}" \
                      --clobber

            # The operator is the only writer of Deployments, and the runner has no cluster access,
            # so the release asks the operator to put the new artifact in front of itself: the route
            # takes the same token as a tenant's release, and the `blong-operator` suite is what tells
            # the operator this announcement is about its own install tree (D-750). No image is left
            # to guesswork — the framework version is read from the manifest at the tag, the same
            # place the tenant path reads it.
            - name: Ask the operator to update itself
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
                  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
                  VERSION: ${{ steps.record.outputs.version }}
                  DIGEST: ${{ steps.zip.outputs.digest }}
                  VERSIONED: ${{ steps.record.outputs.versioned }}
                  FRAMEWORK_IMAGE: ghcr.io/feasibleone/blong-gogo
              run: |
                  set -euo pipefail
                  if [ -z "$DEPLOY_ENDPOINT" ] || [ -z "$DEPLOY_TOKEN" ]; then
                      echo "::error::DEPLOY_ENDPOINT and DEPLOY_TOKEN are required repository secrets"
                      exit 1
                  fi
                  tag="${{ github.event.release.tag_name }}"
                  gogo=$(git show "$tag:.release-please-manifest.json" | jq -r '."core/blong-gogo"')
                  if [ -z "$gogo" ] || [ "$gogo" = "null" ]; then
                      echo "::error::$tag does not carry a core/blong-gogo version"
                      exit 1
                  fi
                  artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${VERSIONED}"
                  body=$(jq -n \
                      --arg id "operator-${GITHUB_RUN_ID}" \
                      --arg token "$DEPLOY_TOKEN" \
                      --arg version "$VERSION" \
                      --arg artifactUrl "$artifact_url" \
                      --arg artifactDigest "$DIGEST" \
                      --arg frameworkImage "$FRAMEWORK_IMAGE" \
                      --arg frameworkVersion "v$gogo" \
                      '{jsonrpc: "2.0",
                        id: $id,
                        method: "kustomize.release.approve",
                        params: {
                          token: $token,
                          suite: "blong-operator",
                          version: $version,
                          artifactUrl: $artifactUrl,
                          artifactDigest: $artifactDigest,
                          frameworkImage: $frameworkImage,
                          frameworkVersion: $frameworkVersion
                      }}')
                  set +e
                  http=$(curl -sS --fail-with-body \
                      -o "$RUNNER_TEMP/operator-answer.json" \
                      -w '%{http_code}' \
                      -X POST "$DEPLOY_ENDPOINT" \
                      -H 'content-type: application/json' \
                      -d "$body")
                  status=$?
                  set -e
                  cat "$RUNNER_TEMP/operator-answer.json" 2>/dev/null || true
                  echo
                  echo "HTTP $http"
                  # The same summary the tenant path writes: the operator's own release describes
                  # itself in the same words, because it is the same document (D-751).
                  if summary=$(jq -er '.result.markdown // empty' "$RUNNER_TEMP/operator-answer.json" 2>/dev/null); then
                      printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"

    deploy:
        name: Ask the operator
        needs: [resolve, artifact]
        if: needs.resolve.outputs.alias != ''
        runs-on: ubuntu-latest
        steps:
            - name: Call the token-gated release route
              env:
                  DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
                  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
                  SUITE: ${{ needs.resolve.outputs.suite }}
                  NAMESPACE: ${{ needs.resolve.outputs.namespace }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  ARTIFACT_URL: ${{ needs.resolve.outputs.artifact_url }}
                  ARTIFACT_DIGEST: ${{ needs.artifact.outputs.digest }}
                  FRAMEWORK_IMAGE: ${{ needs.resolve.outputs.framework_image }}
                  FRAMEWORK_VERSION: ${{ needs.resolve.outputs.framework_version }}
              run: |
                  set -euo pipefail
                  if [ -z "$DEPLOY_ENDPOINT" ] || [ -z "$DEPLOY_TOKEN" ]; then
                      echo "::error::DEPLOY_ENDPOINT and DEPLOY_TOKEN are required repository secrets"
                      exit 1
                  fi
                  # `jq -n --arg`, never a shell-interpolated body: a token or an URL
                  # with a quote in it must not be able to change the JSON.
                  body=$(jq -n \
                      --arg id "deploy-${GITHUB_RUN_ID}" \
                      --arg token "$DEPLOY_TOKEN" \
                      --arg suite "$SUITE" \
                      --arg namespace "$NAMESPACE" \
                      --arg version "$VERSION" \
                      --arg artifactUrl "$ARTIFACT_URL" \
                      --arg artifactDigest "$ARTIFACT_DIGEST" \
                      --arg frameworkImage "$FRAMEWORK_IMAGE" \
                      --arg frameworkVersion "$FRAMEWORK_VERSION" \
                      '{jsonrpc: "2.0",
                        id: $id,
                        method: "kustomize.release.approve",
                        params: {
                          token: $token,
                          suite: $suite,
                          namespace: $namespace,
                          version: $version,
                          artifactUrl: $artifactUrl,
                          artifactDigest: $artifactDigest,
                          frameworkImage: $frameworkImage,
                          frameworkVersion: $frameworkVersion
                      }}')
                  set +e
                  http=$(curl -sS --fail-with-body \
                      -o "$RUNNER_TEMP/answer.json" \
                      -w '%{http_code}' \
                      -X POST "$DEPLOY_ENDPOINT" \
                      -H 'content-type: application/json' \
                      -d "$body")
                  status=$?
                  set -e
                  cat "$RUNNER_TEMP/answer.json" 2>/dev/null || true
                  echo
                  echo "HTTP $http"
                  # The operator builds the summary, so a job page, a chat channel and the log all
                  # say the same thing about the same release (D-751). Written before the exit so
                  # the summary exists even when the call failed: a refused release is exactly the
                  # one a reader needs the page for. An `if`, not `a && b`, so an answer with no
                  # markdown cannot replace the status this step reports.
                  if summary=$(jq -er '.result.markdown // empty' "$RUNNER_TEMP/answer.json" 2>/dev/null); then
                      printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"
