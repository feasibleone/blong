name: Deploy

# A release *batch* is the deployment decision. Release-please publishes one release per changed
# package at once, all of them tagged at the same commit, so one tag says nothing about what a
# deployed suite is missing: `blong-gogo-v1.51.0` moved the framework image and
# `blong-marine-v1.14.0` a realm inside it, and neither names `suite` — which is what a tenant ran
# on for a day. This workflow therefore answers the *Release* workflow finishing, treats
# the releases it published as one batch, and converges every deployment whose `follows` list names
# something in it, once, from the batch's newest tag.
# `workflow_dispatch` stays for a re-deploy, or a deployment whose release was published earlier.
on:
    workflow_run:
        workflows: [Release]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            deployment:
                description: Deployment alias from .github/deployments.json
                required: true
                type: string
            tag:
                description: Release tag to deploy (defaults to the latest release)
                required: false
                type: string

# One batch at a time. The key is the commit the Release run built, so a second Release finishing
# while this one converges waits rather than racing it, and the per-deployment key on the `artifact`
# job keeps two aliases of one batch apart.
concurrency:
    group: deploy-${{ github.event.workflow_run.head_sha || inputs.deployment || github.run_id }}
    cancel-in-progress: false

permissions:
    contents: read

# What the dependency cache carries, in one place, because a cache is identified by its key *and*
# its version — and the version is a hash of this list (@@F-725). It has to stay identical to the
# one the CI workflows save with (`feasibleone/actions`: `rush.yaml`, `release-docker.yaml`).
env:
    CACHE_PATHS: |
        common/temp/deps.tar.zst
        app/*/.rush
        core/*/.rush
        realm/*/.rush
        suite/*/.rush
        demo/*/.rush
        test/*/.rush
        tools/*/.rush
        ext/*/.rush
        library/*/.rush
        docs/*/.rush

jobs:
    resolve:
        name: Plan the deployments
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.plan.outputs.tag }}
            count: ${{ steps.plan.outputs.count }}
            matrix: ${{ steps.plan.outputs.matrix }}
            operator: ${{ steps.plan.outputs.operator }}
            framework_version: ${{ steps.plan.outputs.framework_version }}
            framework_image: ${{ steps.plan.outputs.framework_image }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The map is read from the default branch; what to build is fetched by tag, because
                  # a batch is a set of tags rather than one checked-out ref.
                  fetch-depth: 0

            - name: Plan what this run deploys
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  BATCH_FROM: ${{ github.event.workflow_run.created_at }}
                  BATCH_TO: ${{ github.event.workflow_run.updated_at }}
                  INPUT_DEPLOYMENT: ${{ inputs.deployment }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  map=.github/deployments.json
                  # A matrix GitHub cannot expand is not a skipped job but a broken expression, so a
                  # run with nothing to do carries one placeholder entry and is skipped by `count`.
                  placeholder='[{"alias":"none","packagePath":".","scenario":"none","artifact":"none.zip","namespace":"none","suite":"none"}]'

                  # A `follows` name that no release-please component answers is a list that never
                  # fires, which is exactly how this bug looked from the outside (@@D-832): fail here
                  # rather than leave a suite undeployed for a release nobody noticed.
                  unknown=$(jq -r --slurpfile manifest .release-please-manifest.json \
                      '[ to_entries[].value.follows // [] ] | add | unique
                       - [$manifest[0] | keys[] | split("/") | last] | .[]' "$map")
                  if [ -n "$unknown" ]; then
                      echo "::error::follows names components release-please does not publish: $(tr '\n' ' ' <<<"$unknown")"
                      exit 1
                  fi

                  if [ "$EVENT_NAME" = "workflow_run" ]; then
                      # The batch is what the Release run published: release-please creates its
                      # releases inside that run, so the run's own window bounds them. A run that
                      # published nothing — a metrics push, or a release step that failed — plans
                      # nothing, which is the green-on-every-push behaviour the tag lookup gave.
                      published=$(gh release list --limit 100 --json tagName,publishedAt \
                          | jq -c --arg from "$BATCH_FROM" --arg to "$BATCH_TO" \
                          '[.[] | select(.publishedAt >= $from and .publishedAt <= $to)]
                           | sort_by(.publishedAt)')
                      tag=$(jq -r 'last // empty | .tagName' <<<"$published")
                      if [ -z "$tag" ]; then
                          echo "::notice::the Release run published no release; nothing to deploy"
                          echo 'count=0' >> "$GITHUB_OUTPUT"
                          echo "matrix=$placeholder" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                      # One batch, one commit: release-please tags every release of it at the same
                      # commit, so the newest tag carries the tree the others do (@@D-832).
                      components=$(jq -c '[.[].tagName | sub("-v[0-9].*$"; "")] | unique' <<<"$published")
                      echo "batch $tag: $components"
                      matrix=$(jq -c --argjson components "$components" '
                          [ to_entries[]
                            | select(.value.installer != true)
                            | select(([.value.release] + (.value.follows // [])) as $mine
                                     | any($mine[]; . as $name | $components | index($name) != null))
                            | {alias: .key, packagePath: .value.packagePath,
                               scenario: .value.scenario, artifact: .value.artifact,
                               namespace: .value.namespace, suite: .value.suite} ]' "$map")
                      if printf '%s' "$components" | jq -e 'index("blong-kustomize") != null' > /dev/null; then
                          echo "operator=$tag" >> "$GITHUB_OUTPUT"
                      else
                          echo "operator=" >> "$GITHUB_OUTPUT"
                      fi
                  else
                      alias="$INPUT_DEPLOYMENT"
                      tag="$INPUT_TAG"
                      if [ -z "$tag" ]; then
                          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
                      fi
                      if [ -z "$tag" ]; then
                          echo "::error::no release tag to deploy"
                          exit 1
                      fi
                      matrix=$(jq -c --arg alias "$alias" '
                          [ to_entries[]
                            | select(.key == $alias)
                            | select(.value.installer != true)
                            | {alias: .key, packagePath: .value.packagePath,
                               scenario: .value.scenario, artifact: .value.artifact,
                               namespace: .value.namespace, suite: .value.suite} ]' "$map")
                      if [ "$matrix" = "[]" ]; then
                          echo "::error::$alias is not a tenant deployment in $map"
                          exit 1
                      fi
                      echo "operator=" >> "$GITHUB_OUTPUT"
                  fi

                  count=$(jq 'length' <<<"$matrix")
                  if [ "$count" = "0" ]; then
                      matrix="$placeholder"
                  fi
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "planning $tag: $count deployment(s)"

                  gogo=$(git show "$tag:.release-please-manifest.json" \
                      | jq -r '."core/blong-gogo"')
                  if [ -z "$gogo" ] || [ "$gogo" = "null" ]; then
                      echo "::error::$tag does not carry a core/blong-gogo version"
                      exit 1
                  fi
                  echo "framework_version=v$gogo" >> "$GITHUB_OUTPUT"
                  echo "framework_image=ghcr.io/feasibleone/blong-gogo" >> "$GITHUB_OUTPUT"

            - name: Wait for the framework image
              if: steps.plan.outputs.count != '0' || steps.plan.outputs.operator != ''
              env:
                  FRAMEWORK_IMAGE: ${{ steps.plan.outputs.framework_image }}
                  FRAMEWORK_VERSION: ${{ steps.plan.outputs.framework_version }}
              run: |
                  set -euo pipefail
                  image="${FRAMEWORK_IMAGE}:${FRAMEWORK_VERSION}"
                  echo "waiting for $image"
                  for _ in $(seq 1 90); do
                      if docker manifest inspect "$image" >/dev/null 2>&1; then
                          echo "$image is published"
                          exit 0
                      fi
                      sleep 10
                  done
                  echo "::error::$image was not published within ten minutes"
                  exit 1

    artifact:
        name: Deploy ${{ matrix.alias }}
        needs: resolve
        # A run whose batch names no deployment carries the placeholder entry, and `count` skips the
        # legs — the green-on-every-push behaviour of a release nobody deploys (@@D-832).
        if: needs.resolve.outputs.count != '0'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
        # Two aliases of one batch build in parallel; the same alias from two runs does not.
        concurrency:
            group: deploy-${{ matrix.alias }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.tag }}
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # The install is this job's largest cost and it buys the framework's dev dependency
            # tree rather than anything the artifact runs: 197 s measured on 2026-11-12 (run
            # 43207810220), most of it node-rdkafka's native build inside `blong-gogo`, which the
            # zip does not carry at all — the deploy tree is the scenario's twelve production
            # packages. The store CI publishes is what a warm install needs, so this job restores
            # it and leaves the writing to CI (@@D-546 @@D-830).
            #
            # `path` is CI's whole list rather than the one file this job uses, because the action
            # hashes the list into the cache *version* and matches on key and version both: naming
            # less reports a miss for an archive that exists (@@F-725).
            - name: Restore the pnpm store
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.CACHE_PATHS }}
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-

            - name: Unpack the pnpm store and drop CI's build state
              # The archive holds the store as one `deps.tar.zst` and CI's project `.rush` trees
              # beside it. The store is what the install needs; the trees are removed because their
              # build cache describes a run whose `dist` this checkout does not have, so a hit would
              # report every project up to date — the stale output of @@F-555 arriving in an
              # artifact instead of in a test. The install writes its own state.
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  if [ -f common/temp/deps.tar.zst ]; then
                      zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
                  else
                      echo 'No deps.tar.zst in the restored archive; the install builds the store.'
                      echo '::notice::no pnpm store in the cache, so this install is cold'
                  fi
                  for category in app core realm suite demo test tools ext library docs; do
                      for tree in "$category"/*/.rush; do rm -rf "$tree"; done
                  done

            - name: Install
              run: node common/scripts/install-run-rush.js install

            # The first deploy answers what the zip carries — its project list is
            # `extractor-metadata.json` — and costs two seconds; the second one, after the build,
            # is what puts the fresh `dist` trees in it (@@D-830).
            - name: Deploy the scenario, to read what it carries
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ matrix.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy" \
                      --overwrite

            # `--to <package>` follows the realm's devDependencies, so it built 27 projects for an
            # artifact of 12 — the tap, storybook and browser tooling among them (@@D-830). The
            # scenario's list is the set whose output the artifact can use: build that.
            - name: Build what the artifact carries
              env:
                  # No deployed process reads the framework's declaration bundle (@@D-831).
                  BLONG_SKIP_DTS: 1
              run: |
                  set -euo pipefail
                  mapfile -t projects < <(jq -r '.projects[].projectName' "$RUNNER_TEMP/deploy/extractor-metadata.json")
                  args=()
                  for project in "${projects[@]}"; do args+=("--only=$project"); done
                  echo "building ${#projects[@]} project(s): ${projects[*]}"
                  node common/scripts/install-run-rush.js build "${args[@]}"

            - name: Deploy the scenario
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ matrix.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy" \
                      --overwrite

            - name: Zip it and hash it
              id: zip
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP/deploy"
                  # The artifact is the whole deployment scenario: the entry, the realms
                  # it carries and the browser bundle, because the operator mounts this
                  # directory and runs the entry inside it.
                  zip -qr "$RUNNER_TEMP/${{ matrix.artifact }}" .
                  digest=$(sha256sum "$RUNNER_TEMP/${{ matrix.artifact }}" | awk '{print $1}')
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "sha256=$digest"

            - name: Attach it to the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ needs.resolve.outputs.tag }}" \
                      "$RUNNER_TEMP/${{ matrix.artifact }}" \
                      --clobber

            # The operator's gateway is the only door this workflow opens, and the deployment's own
            # version comes from the manifest at the tag rather than from the tag's suffix: a batch
            # may be triggered by any component, so a `blong-gogo-v1.51.0` batch deploys `suite`
            # 1.19.0 with framework v1.51.0, and both versions travel in the body so the operator
            # shows what moved (@@D-832, D-751).
            - name: Ask the operator to converge
              env:
                  DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
                  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
                  TAG: ${{ needs.resolve.outputs.tag }}
                  SUITE: ${{ matrix.suite }}
                  NAMESPACE: ${{ matrix.namespace }}
                  PACKAGE_PATH: ${{ matrix.packagePath }}
                  ARTIFACT: ${{ matrix.artifact }}
                  ARTIFACT_DIGEST: ${{ steps.zip.outputs.digest }}
                  FRAMEWORK_IMAGE: ${{ needs.resolve.outputs.framework_image }}
                  FRAMEWORK_VERSION: ${{ needs.resolve.outputs.framework_version }}
              run: |
                  set -euo pipefail
                  if [ -z "$DEPLOY_ENDPOINT" ] || [ -z "$DEPLOY_TOKEN" ]; then
                      echo "::error::DEPLOY_ENDPOINT and DEPLOY_TOKEN are required repository secrets"
                      exit 1
                  fi
                  version=$(git show "$TAG:.release-please-manifest.json" \
                      | jq -r --arg path "$PACKAGE_PATH" '.[$path]')
                  if [ -z "$version" ] || [ "$version" = "null" ]; then
                      echo "::error::$TAG does not carry a version for $PACKAGE_PATH"
                      exit 1
                  fi
                  artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARTIFACT}"
                  # `jq -n --arg`, never a shell-interpolated body: a token or an URL with a quote
                  # in it must not be able to change the JSON.
                  body=$(jq -n \
                      --arg id "deploy-${GITHUB_RUN_ID}-${{ matrix.alias }}" \
                      --arg token "$DEPLOY_TOKEN" \
                      --arg suite "$SUITE" \
                      --arg namespace "$NAMESPACE" \
                      --arg version "$version" \
                      --arg artifactUrl "$artifact_url" \
                      --arg artifactDigest "$ARTIFACT_DIGEST" \
                      --arg frameworkImage "$FRAMEWORK_IMAGE" \
                      --arg frameworkVersion "$FRAMEWORK_VERSION" \
                      '{jsonrpc: "2.0",
                        id: $id,
                        method: "kustomize.release.approve",
                        params: {
                          token: $token,
                          suite: $suite,
                          namespace: $namespace,
                          version: $version,
                          artifactUrl: $artifactUrl,
                          artifactDigest: $artifactDigest,
                          frameworkImage: $frameworkImage,
                          frameworkVersion: $frameworkVersion
                      }}')
                  set +e
                  http=$(curl -sS --fail-with-body \
                      -o "$RUNNER_TEMP/answer.json" \
                      -w '%{http_code}' \
                      -X POST "$DEPLOY_ENDPOINT" \
                      -H 'content-type: application/json' \
                      -d "$body")
                  status=$?
                  set -e
                  cat "$RUNNER_TEMP/answer.json" 2>/dev/null || true
                  echo
                  echo "HTTP $http"
                  # The operator builds the summary, so a job page, a chat channel and the log all
                  # say the same thing about the same release (D-751). Written before the exit so
                  # the summary exists even when the call failed: a refused release is exactly the
                  # one a reader needs the page for. An `if`, not `a && b`, so an answer with no
                  # markdown cannot replace the status this step reports.
                  if summary=$(jq -er '.result.markdown // empty' "$RUNNER_TEMP/answer.json" 2>/dev/null); then
                      printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"

    operator-artifact:
        name: Build and attach the operator artifact
        needs: resolve
        # The deployment realm is not a tenant's suite: its own release publishes the artifact the
        # operator runs *itself* from, so the job answers the batch that contains a
        # `blong-kustomize-v<version>` release — what an installer points `OPERATOR_ARTIFACT_URL`
        # at, and what `realm/blong-kustomize/deploy.sh` resolves in its release form (@@D-654). It
        # builds from the batch's tag like every other job, because a batch is one commit (@@D-832).
        if: needs.resolve.outputs.operator != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.tag }}
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Same store cache as the tenant artifact job, and for the same reason: the operator's
            # artifact is `blong-kustomize` and its production dependencies, while the install
            # pays for the framework's whole dev tree (175 s in run 43207804416) (@@D-546 @@D-830).
            # `path` names CI's whole list because the action hashes it into the cache version
            # (@@F-725), and the build state that arrives with it is dropped before the build
            # (@@F-555).
            - name: Restore the pnpm store
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.CACHE_PATHS }}
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-

            - name: Unpack the pnpm store and drop CI's build state
              # The archive holds the store as one `deps.tar.zst` and CI's project `.rush` trees
              # beside it. The store is what the install needs; the trees are removed because their
              # build cache describes a run whose `dist` this checkout does not have, so a hit would
              # report every project up to date — the stale output of @@F-555 arriving in an
              # artifact instead of in a test. The install writes its own state.
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  if [ -f common/temp/deps.tar.zst ]; then
                      zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
                  else
                      echo 'No deps.tar.zst in the restored archive; the install builds the store.'
                      echo '::notice::no pnpm store in the cache, so this install is cold'
                  fi
                  for category in app core realm suite demo test tools ext library docs; do
                      for tree in "$category"/*/.rush; do rm -rf "$tree"; done
                  done

            - name: Install
              run: node common/scripts/install-run-rush.js install

            # The coordinates live in `.github/deployments.json`, beside the deployments, because that
            # is the one place a release reads them from — and `deploy.sh` reads the same record, so
            # the two cannot disagree about the release prefix or the artifact's name.
            - name: Read the installer record
              id: record
              env:
                  TAG: ${{ needs.resolve.outputs.tag }}
              run: |
                  set -euo pipefail
                  entry=$(jq -c '.operator' .github/deployments.json)
                  # The version is the operator's own, read from the manifest at the batch's tag: the
                  # batch may have been published by any component, so the tag's suffix says nothing
                  # about `blong-kustomize` (@@D-832).
                  version=$(git show "$TAG:.release-please-manifest.json" \
                      | jq -r --arg path "$(jq -r '.packagePath' <<<"$entry")" '.[$path]')
                  if [ -z "$version" ] || [ "$version" = "null" ]; then
                      echo "::error::$TAG does not carry a version for the operator's package path"
                      exit 1
                  fi
                  echo "scenario=$(jq -r '.scenario' <<<"$entry")" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  # Two names for one file, because they answer two questions: the versioned one is
                  # what a version installs and cannot be overwritten by the next release, and the
                  # stable one is what `operator-entry.ts` already names as its default
                  # (`releases/latest/download/blong-kustomize.zip`).
                  echo "versioned=$(jq -r '.artifact' <<<"$entry" | sed "s/\.zip$/-$version.zip/")" >> "$GITHUB_OUTPUT"
                  echo "alias=$(jq -r '.artifact' <<<"$entry")" >> "$GITHUB_OUTPUT"

            # The first deploy answers what the artifact carries — `extractor-metadata.json`
            # lists the projects the operator scenario ships — and costs a second; the second one,
            # after the build, is what puts the fresh `dist` trees in it (@@D-830).
            - name: Deploy the operator scenario, to read what it carries
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ steps.record.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy-operator" \
                      --overwrite

            # `--to <package>` follows the realm's devDependencies, so it built the test and
            # storybook tooling the operator never runs (@@D-830). Build what the artifact carries,
            # and skip the framework's declaration bundle — no deployed process reads it (@@D-831).
            - name: Build the realm
              env:
                  BLONG_SKIP_DTS: 1
              run: |
                  set -euo pipefail
                  mapfile -t projects < <(jq -r '.projects[].projectName' "$RUNNER_TEMP/deploy-operator/extractor-metadata.json")
                  args=()
                  for project in "${projects[@]}"; do args+=("--only=$project"); done
                  echo "building ${#projects[@]} project(s): ${projects[*]}"
                  node common/scripts/install-run-rush.js build "${args[@]}"

            - name: Deploy the operator scenario
              run: |
                  node common/scripts/install-run-rush.js deploy \
                      --scenario ${{ steps.record.outputs.scenario }} \
                      --target-folder "$RUNNER_TEMP/deploy-operator" \
                      --overwrite

            - name: Zip it and hash it
              id: zip
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP/deploy-operator"
                  # The operator runs this directory: the realm's entry (`operator-entry.ts`), the
                  # framework it carries and the link script's relative links — which is what makes
                  # the cache it is unpacked into readable from wherever it is mounted (D-476).
                  zip -qr "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" .
                  cp "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" \
                     "$RUNNER_TEMP/${{ steps.record.outputs.alias }}"
                  digest=$(sha256sum "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" | awk '{print $1}')
                  # The digest travels as an asset rather than as a sentence in the release body,
                  # because it is read by a script: `deploy.sh` fetches it so the operator's cache and
                  # volume identity follow the artifact rather than its version (D-469), and nothing
                  # has to download and hash the zip to find out what it is.
                  echo "$digest  ${{ steps.record.outputs.versioned }}" \
                      > "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}.sha256"
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "sha256=$digest"

            - name: Attach them to the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ needs.resolve.outputs.tag }}" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.versioned }}.sha256" \
                      "$RUNNER_TEMP/${{ steps.record.outputs.alias }}" \
                      --clobber

            # The operator is the only writer of Deployments, and the runner has no cluster access,
            # so the release asks the operator to put the new artifact in front of itself: the route
            # takes the same token as a tenant's release, and the `blong-operator` suite is what tells
            # the operator this announcement is about its own install tree (D-750). No image is left
            # to guesswork — the framework version is read from the manifest at the tag, the same
            # place the tenant path reads it.
            - name: Ask the operator to update itself
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
                  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
                  TAG: ${{ needs.resolve.outputs.tag }}
                  VERSION: ${{ steps.record.outputs.version }}
                  DIGEST: ${{ steps.zip.outputs.digest }}
                  VERSIONED: ${{ steps.record.outputs.versioned }}
                  FRAMEWORK_IMAGE: ${{ needs.resolve.outputs.framework_image }}
                  FRAMEWORK_VERSION: ${{ needs.resolve.outputs.framework_version }}
              run: |
                  set -euo pipefail
                  if [ -z "$DEPLOY_ENDPOINT" ] || [ -z "$DEPLOY_TOKEN" ]; then
                      echo "::error::DEPLOY_ENDPOINT and DEPLOY_TOKEN are required repository secrets"
                      exit 1
                  fi
                  tag="$TAG"
                  artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${VERSIONED}"
                  body=$(jq -n \
                      --arg id "operator-${GITHUB_RUN_ID}" \
                      --arg token "$DEPLOY_TOKEN" \
                      --arg version "$VERSION" \
                      --arg artifactUrl "$artifact_url" \
                      --arg artifactDigest "$DIGEST" \
                      --arg frameworkImage "$FRAMEWORK_IMAGE" \
                      --arg frameworkVersion "$FRAMEWORK_VERSION" \
                      '{jsonrpc: "2.0",
                        id: $id,
                        method: "kustomize.release.approve",
                        params: {
                          token: $token,
                          suite: "blong-operator",
                          version: $version,
                          artifactUrl: $artifactUrl,
                          artifactDigest: $artifactDigest,
                          frameworkImage: $frameworkImage,
                          frameworkVersion: $frameworkVersion
                      }}')
                  set +e
                  http=$(curl -sS --fail-with-body \
                      -o "$RUNNER_TEMP/operator-answer.json" \
                      -w '%{http_code}' \
                      -X POST "$DEPLOY_ENDPOINT" \
                      -H 'content-type: application/json' \
                      -d "$body")
                  status=$?
                  set -e
                  cat "$RUNNER_TEMP/operator-answer.json" 2>/dev/null || true
                  echo
                  echo "HTTP $http"
                  # The same summary the tenant path writes: the operator's own release describes
                  # itself in the same words, because it is the same document (D-751).
                  if summary=$(jq -er '.result.markdown // empty' "$RUNNER_TEMP/operator-answer.json" 2>/dev/null); then
                      printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$status"
