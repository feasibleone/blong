<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    style="display: grid; gap: 8px; max-width: 400px;"
  >
    <div
      class="blong-field"
    >
      <label
        for="passwordText"
      >
        Password
      </label>
      <input
        name="passwordText"
        type="password"
        id="passwordText"
        class=""
        style=""
      />
    </div>
    <div
      class="blong-field"
    >
      <label
        for="bioText"
      >
        Bio
      </label>
      <textarea
        name="bioText"
        id="bioText"
        class=""
        maxlength="500"
        rows="5"
        style=""
      />
    </div>
    <div
      class="blong-field"
    >
      <label
        for="phoneNumber"
      >
        Phone
      </label>
      <input
        name="phoneNumber"
        type="text"
        id="phoneNumber"
        class=""
        mask="(999) 999-9999"
        style=""
      />
    </div>
  </form>
</div>
