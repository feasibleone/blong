<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    class="blong-form blong-form-create "
    novalidate=""
  >
    <fieldset
      class="blong-card blong-card-default"
    >
      <legend>
        Details
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="firstName"
        >
          First Name
        </label>
        <input
          name="firstName"
          type="text"
          id="firstName"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="lastName"
        >
          Last Name
        </label>
        <input
          name="lastName"
          type="text"
          id="lastName"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="emailAddress"
        >
          Email
        </label>
        <input
          name="emailAddress"
          type="text"
          id="emailAddress"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="phoneNumber"
        >
          Phone
        </label>
        <input
          name="phoneNumber"
          type="text"
          id="phoneNumber"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="notes"
        >
          Notes
        </label>
        <input
          name="notes"
          type="text"
          id="notes"
          class=""
          maxlength="500"
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="isActive"
        >
          Active
        </label>
        <input
          name="isActive"
          type="checkbox"
          id="isActive"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="age"
        >
          Age
        </label>
        <input
          name="age"
          type="number"
          id="age"
          class=""
          min="0"
          max="150"
          maxfractiondigits="0"
          style=""
        />
      </div>
    </fieldset>
  </form>
</div>
