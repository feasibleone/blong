<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    class="blong-form blong-form-create blong-polymorphic-layout "
    novalidate=""
  >
    <fieldset
      class="blong-card blong-card-base"
    >
      <legend>
        Transaction
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="transactionType"
        >
          Transaction Type
        </label>
        <select
          name="transactionType"
          id="transactionType"
          class=""
        >
          <option
            value=""
          >
            Select...
          </option>
        </select>
      </div>
      <div
        class="blong-field"
      >
        <label
          for="amount"
        >
          Amount
        </label>
        <input
          name="amount"
          type="number"
          id="amount"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="description"
        >
          Description
        </label>
        <input
          name="description"
          type="text"
          id="description"
          class=""
          style=""
        />
      </div>
    </fieldset>
    <fieldset
      class="blong-card blong-card-transfer"
    >
      <legend>
        Transfer Details
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="sourceAccount"
        >
          Source Account
        </label>
        <input
          name="sourceAccount"
          type="text"
          id="sourceAccount"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="destinationAccount"
        >
          Destination Account
        </label>
        <input
          name="destinationAccount"
          type="text"
          id="destinationAccount"
          class=""
          style=""
        />
      </div>
    </fieldset>
    <fieldset
      class="blong-card blong-card-extra"
    >
      <legend>
        Additional
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="notes"
        >
          Notes
        </label>
        <input
          name="notes"
          type="text"
          id="notes"
          class=""
          maxlength="500"
          style=""
        />
      </div>
    </fieldset>
  </form>
</div>
