<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    style="display: grid; gap: 8px; max-width: 400px;"
  >
    <div
      class="blong-field"
    >
      <label
        for="userName"
      >
        Username
      </label>
      <input
        name="userName"
        type="text"
        id="userName"
        class=""
        style=""
      />
    </div>
    <div
      class="blong-field"
    >
      <label
        for="age"
      >
        Age
      </label>
      <input
        name="age"
        type="number"
        id="age"
        class=""
        min="0"
        max="150"
        maxfractiondigits="0"
        style=""
      />
    </div>
    <div
      class="blong-field"
    >
      <label
        for="isActive"
      >
        Active
      </label>
      <input
        name="isActive"
        type="checkbox"
        id="isActive"
        class=""
        style=""
      />
    </div>
    <div
      class="blong-field"
    >
      <label
        for="birthDate"
      >
        Birth Date
      </label>
      <input
        name="birthDate"
        type="date"
        id="birthDate"
        class=""
        style=""
      />
    </div>
  </form>
</div>
