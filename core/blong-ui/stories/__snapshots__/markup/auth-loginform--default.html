<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <div
    class="blong-login-form "
  >
    <h2>
      Sign In
    </h2>
    <form>
      <div
        class="blong-field"
      >
        <label
          for="username"
        >
          Username
        </label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          name="username"
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="password"
        >
          Password
        </label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          name="password"
          style=""
        />
      </div>
      <button
        type="submit"
        class="blong-login-button"
      >
        Sign In
      </button>
    </form>
  </div>
</div>
