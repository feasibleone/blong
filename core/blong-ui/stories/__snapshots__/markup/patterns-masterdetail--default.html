<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <div
    class="blong-master-detail "
  >
    <div
      class="blong-master-section"
    >
      <h4>
        Users
      </h4>
      <div
        class="blong-table "
      >
        <table>
          <thead>
            <tr>
              <th
                class="blong-th-sortable"
              >
                ID
              </th>
              <th
                class="blong-th-sortable"
              >
                Username
              </th>
              <th
                class="blong-th-sortable"
              >
                Email
              </th>
            </tr>
          </thead>
          <tbody>
            <tr
              class="blong-tr blong-tr-selected blong-tr-selectable"
            >
              <td>
                1
              </td>
              <td>
                alice
              </td>
              <td>
                alice@example.com
              </td>
            </tr>
            <tr
              class="blong-tr  blong-tr-selectable"
            >
              <td>
                2
              </td>
              <td>
                bob
              </td>
              <td>
                bob@example.com
              </td>
            </tr>
            <tr
              class="blong-tr  blong-tr-selectable"
            >
              <td>
                3
              </td>
              <td>
                charlie
              </td>
              <td>
                charlie@example.com
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div
      class="blong-detail-section"
    >
      <h4>
        Edit User
      </h4>
      <form
        class="blong-form blong-form-edit "
        novalidate=""
      >
        <fieldset
          class="blong-card blong-card-details"
        >
          <legend>
            Details
          </legend>
          <div
            class="blong-field"
          >
            <label
              for="userName"
            >
              Username
            </label>
            <input
              name="userName"
              type="text"
              id="userName"
              class=""
              style=""
            />
          </div>
          <div
            class="blong-field"
          >
            <label
              for="emailAddress"
            >
              Email
            </label>
            <input
              name="emailAddress"
              type="text"
              id="emailAddress"
              class=""
              style=""
            />
          </div>
          <div
            class="blong-field"
          >
            <label
              for="firstName"
            >
              First Name
            </label>
            <input
              name="firstName"
              type="text"
              id="firstName"
              class=""
              style=""
            />
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
