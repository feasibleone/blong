<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    class="blong-form blong-form-create "
    novalidate=""
  >
    <fieldset
      class="blong-card blong-card-default"
    >
      <legend>
        Details
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="userName"
        >
          Username
        </label>
        <input
          name="userName"
          type="text"
          id="userName"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="emailAddress"
        >
          Email
        </label>
        <input
          name="emailAddress"
          type="text"
          id="emailAddress"
          class=""
          style=""
        />
      </div>
    </fieldset>
    <fieldset
      class="blong-card blong-card-address"
    >
      <legend>
        Address
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="street"
        >
          Street
        </label>
        <input
          name="street"
          type="text"
          id="street"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="city"
        >
          City
        </label>
        <input
          name="city"
          type="text"
          id="city"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="postalCode"
        >
          Postal Code
        </label>
        <input
          name="postalCode"
          type="text"
          id="postalCode"
          class=""
          style=""
        />
      </div>
    </fieldset>
  </form>
</div>
