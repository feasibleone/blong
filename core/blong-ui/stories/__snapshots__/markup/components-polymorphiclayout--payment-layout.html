<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    class="blong-form blong-form-edit blong-polymorphic-layout "
    novalidate=""
  >
    <fieldset
      class="blong-card blong-card-base"
    >
      <legend>
        Transaction
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="transactionType"
        >
          Transaction Type
        </label>
        <select
          name="transactionType"
          id="transactionType"
          class=""
        >
          <option
            value=""
          >
            Select...
          </option>
        </select>
      </div>
      <div
        class="blong-field"
      >
        <label
          for="amount"
        >
          Amount
        </label>
        <input
          name="amount"
          type="number"
          id="amount"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="description"
        >
          Description
        </label>
        <input
          name="description"
          type="text"
          id="description"
          class=""
          style=""
        />
      </div>
    </fieldset>
    <fieldset
      class="blong-card blong-card-payment"
    >
      <legend>
        Payment Details
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="payeeId"
        >
          Payee
        </label>
        <input
          name="payeeId"
          type="number"
          id="payeeId"
          class=""
          maxfractiondigits="0"
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="payeeReference"
        >
          Payment Reference
        </label>
        <input
          name="payeeReference"
          type="text"
          id="payeeReference"
          class=""
          style=""
        />
      </div>
    </fieldset>
    <fieldset
      class="blong-card blong-card-extra"
    >
      <legend>
        Additional
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="notes"
        >
          Notes
        </label>
        <input
          name="notes"
          type="text"
          id="notes"
          class=""
          maxlength="500"
          style=""
        />
      </div>
    </fieldset>
  </form>
</div>
