<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <div
    class="blong-design-editor "
  >
    <button
      class="blong-design-toggle "
      title="Enter design mode"
    >
      ⚙
    </button>
    <div
      class="blong-design-content"
    >
      <form
        class="blong-form blong-form-edit "
        novalidate=""
      >
        <fieldset
          class="blong-card blong-card-account"
        >
          <legend>
            Account
          </legend>
          <div
            class="blong-field"
          >
            <label
              for="userName"
            >
              Username
            </label>
            <input
              name="userName"
              type="text"
              id="userName"
              class=""
              style=""
            />
          </div>
          <div
            class="blong-field"
          >
            <label
              for="emailAddress"
            >
              Email
            </label>
            <input
              name="emailAddress"
              type="text"
              id="emailAddress"
              class=""
              style=""
            />
          </div>
        </fieldset>
        <fieldset
          class="blong-card blong-card-personal"
        >
          <legend>
            Personal
          </legend>
          <div
            class="blong-field"
          >
            <label
              for="firstName"
            >
              First Name
            </label>
            <input
              name="firstName"
              type="text"
              id="firstName"
              class=""
              style=""
            />
          </div>
          <div
            class="blong-field"
          >
            <label
              for="lastName"
            >
              Last Name
            </label>
            <input
              name="lastName"
              type="text"
              id="lastName"
              class=""
              style=""
            />
          </div>
          <div
            class="blong-field"
          >
            <label
              for="isActive"
            >
              Active
            </label>
            <input
              name="isActive"
              type="checkbox"
              id="isActive"
              class=""
              style=""
            />
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
