<div
  style="background: var(--surface-ground, #111827); color: var(--text-color, rgba(255,255,255,0.87)); min-height: 100vh; padding: 1rem;"
>
  <form
    class="blong-form blong-form-create "
    novalidate=""
  >
    <div
      class="blong-tabs"
      role="tablist"
    >
      <button
        role="tab"
        type="button"
        aria-selected="true"
        class="blong-tab blong-tab-active"
      >
        Personal
      </button>
      <button
        role="tab"
        type="button"
        aria-selected="false"
        class="blong-tab "
      >
        Contact
      </button>
      <button
        role="tab"
        type="button"
        aria-selected="false"
        class="blong-tab "
      >
        Extra
      </button>
    </div>
    <fieldset
      class="blong-card blong-card-personal"
    >
      <legend>
        Personal
      </legend>
      <div
        class="blong-field"
      >
        <label
          for="firstName"
        >
          First Name
        </label>
        <input
          name="firstName"
          type="text"
          id="firstName"
          class=""
          style=""
        />
      </div>
      <div
        class="blong-field"
      >
        <label
          for="lastName"
        >
          Last Name
        </label>
        <input
          name="lastName"
          type="text"
          id="lastName"
          class=""
          style=""
        />
      </div>
    </fieldset>
  </form>
</div>
