# RBAC test seed — grants `$subject` capabilities to the seeded roles.
#
# `testAdmin` / `testUser` hold the `Admin` role, so the `$subjectManage`
# capability gives them every `$subject` action; `testManager` (role `Manager`)
# gets read + edit but not remove; `testViewer` (role `Customer`) and
# `testGuest` (role `Guest`) get read-only — which is what lets the Storybook
# toolbar's Role item show a permission difference rather than three identical
# screens, and what the access-control test relies on for its 403 (it calls
# `add`, which none of the read-only roles holds).
#
# The file name is deliberately `accessAuthorizationMerge.yaml` (NOT
# `$subject`-prefixed): the seed method is derived from the file name, so this
# dispatches `access.authorization.merge` to blong-access's SHARED
# `accessAuthorizationMerge` handler (attached to the `db` adapter), which
# processes the generic `role`/`capability` params — no realm-local
# authorization handler is needed. Only the CONTENT carries `$subject`
# placeholders, substituted per realm at scaffold time.
#
# Capability names are the NON-dotted handler names (the default convention).
role:
  Admin: $subjectManage
  Manager: $subjectMaintain
  Customer: $subjectView
  Guest: $subjectView
capability:
  $subjectManage: $subject$ObjectAdd,$subject$ObjectFind,$subject$ObjectGet,$subject$ObjectEdit,$subject$ObjectRemove,subject.object.schema
  $subjectMaintain: $subject$ObjectAdd,$subject$ObjectFind,$subject$ObjectGet,$subject$ObjectEdit,subject.object.schema
  $subjectView: $subject$ObjectFind,$subject$ObjectGet,subject.object.schema

