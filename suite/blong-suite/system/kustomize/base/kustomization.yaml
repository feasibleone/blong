apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: blong-kustomize
      app.kubernetes.io/name: blong-suite
      app.kubernetes.io/part-of: blong-suite
resources:
  - configmaps/assets-config.yaml
  - deployments/access.yaml
  - deployments/assets.yaml
  - deployments/core.yaml
  - deployments/login.yaml
  - deployments/marine.yaml
  - rbac/auth-review-binding.yaml
  - rbac/auth-review.yaml
  - rbac/blong-operator-role.yaml
  - rbac/blong-operator-rolebinding.yaml
  - rbac/jobs-role.yaml
  - rbac/jobs-rolebinding.yaml
  - rbac/service-account.yaml
  - services/access.yaml
  - services/assets-http.yaml
  - services/blong.yaml
  - services/core.yaml
  - services/login.yaml
  - services/marine.yaml
  - services/web-http.yaml
