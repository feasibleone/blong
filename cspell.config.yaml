version: "0.2"
language: en-GB
# A `semlog://` reference is an identifier rather than prose: its tail is a ULID, and cspell splits
# it into fragments that read as misspellings (`AQWM`, `HNGDJG`, `JQFP`). `plans/**` is excluded from
# the check, so this bites where an id is quoted beside the sentence explaining it — the memory files
# — and the useful reaction is to stop reading ids as words rather than to teach the dictionary their
# fragments.
ignoreRegExpList: [ semlog://\S+ ]
